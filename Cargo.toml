[workspace]
resolver = "2"
members = [
  "crates/sourcetrait_lib_sandbox",
  "crates/sourcetrait_lib_note",
]

[workspace.dependencies]
chrono = "0.4"
convert_case = "0.8"
derive_builder = "0.20"
dirs = "6"
oci-client = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = { version = "3", features = ["path"] }
strum = { version = "0.27", features = ["derive"] }
snafu = "0.9"
thiserror = "2"
toml = "0.8"
reqwest = "0.13"
sourcetrait_chronox = "1"
sourcetrait_tomlx = "3"
sourcetrait_testing = "4"
